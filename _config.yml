# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
locale: "en-US"
title: "Cristian Schmitt Nieto's Blog"
email: blog@schmitt-nieto.com
description: "Hands-on Azure, Azure Local and Azure Virtual Desktop guidance: architecture notes, deployment walkthroughs and troubleshooting for IT professionals."
url: "https://schmitt-nieto.com"
baseurl: ""
github_username: schmittnieto
minimal_mistakes_skin: "dark"
logo: "/assets/img/logo3.png"
masthead_title: "To Infinity and Azure"
social:
  type: Person
  name: Cristian Schmitt Nieto
  links:
    - "https://github.com/schmittnieto"
    - "https://www.linkedin.com/in/cristian-schmitt-nieto/"

# Search
search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true
  

# Home page intro, shown above the post list on the first page only.
# enabled: false hides it. Cards render in the order listed; remove an entry to hide that card.
# Card types:
#   nav:  a key in _data/navigation.yml. Links to its first entry, "{count}" in text becomes the number of entries.
#   url:  a plain link.
# link_label is optional. Defaults: "Start with <first entry>" for nav cards, "Open" for url cards.
home_intro:
  enabled: true
  lead: "Hands-on notes on Azure Local, Azure Virtual Desktop and hybrid Azure, written from my lab and customer projects."
  cards:
    - title: "Azure Local series"
      nav: Azurelocal
      text: "{count} guides, from use cases and a demo lab to day 2 operations, Terraform and troubleshooting."
    - title: "Azure Virtual Desktop series"
      nav: Avd
      text: "{count} guides on AVD, including session hosts on Azure Local and Nerdio Manager."
    - title: "Azure Local Calculator"
      url: /azurelocal-calculator/
      text: "Planning, CPU and storage sizing and pricing for every Azure Local deployment type, with import from ODIN."
      link_label: "Open the calculator"

# /posts/ archive. Readers can switch between both orders on the page,
# this sets which one shows first: "published" (year and month of the publish date)
# or "updated" (last_modified_at, falling back to the publish date).
posts_archive:
  default_sort: published

# Miscellaneous
enable_copy_code_button: true
teaser: /assets/img/avatar-logo2.png

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Berlin

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - STYLING.md 
  - assets/repo/
  - private-posts/
  - scripts/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from

author:
  name   : "Cristian Schmitt Nieto"
  avatar : "/assets/img/avatar-csn.jpeg"
  home   : "/about/"   # avatar and name in the author sidebar link here
  bio    : "Azure Consultant with over 10 years of IT experience, sharing insights and solutions here 😊"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/schmittnieto"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/cristian-schmitt-nieto/"     

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/schmittnieto"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/cristian-schmitt-nieto/"     

comments:
  provider: "disqus"
  disqus:
    shortname:  "schmittnieto"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
    # _assets 
  - scope:
      path: 'assets/**'
    values:
      sitemap: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

